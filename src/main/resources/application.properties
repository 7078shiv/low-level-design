spring.application.name=chess

# most hosts inject the port they want the app on
server.port=${PORT:8080}

# The UI is plain static files, keep the browser from caching stale JS during development
spring.web.resources.cache.period=0

# Multiplies how long the bot may think. Raise it on a small cloud instance, where the
# same seconds buy far fewer nodes than on a desktop core.
chess.bot.time-scale=${CHESS_BOT_TIME_SCALE:1.0}
