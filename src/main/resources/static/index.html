<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9822;</text></svg>">
</head>
<body>

<header class="topbar">
    <h1><span class="mark">&#9816;</span> Chess</h1>
    <p class="subtitle">Spring Boot engine &middot; <code>org.example.lld.chess</code></p>
</header>

<main class="layout">

    <section class="board-area">
        <div class="player-strip" id="strip-top">
            <div class="who"><span class="dot"></span><span class="pname">Black</span></div>
            <div class="taken" id="taken-top"></div>
            <div class="advantage" id="adv-top"></div>
        </div>

        <div class="board-frame">
            <div class="board" id="board" aria-label="Chess board"></div>
            <div class="ranks" id="ranks"></div>
            <div class="files" id="files"></div>
        </div>

        <div class="player-strip" id="strip-bottom">
            <div class="who"><span class="dot white"></span><span class="pname">White</span></div>
            <div class="taken" id="taken-bottom"></div>
            <div class="advantage" id="adv-bottom"></div>
        </div>
    </section>

    <aside class="panel">
        <div class="status" id="status">
            <div class="status-line" id="status-turn">White to move</div>
            <div class="status-note" id="status-note"></div>
            <div class="thinking hidden" id="thinking">
                <span class="spinner"></span><span id="thinking-text">Thinking…</span>
            </div>
        </div>

        <div class="controls">
            <button id="btn-new" class="primary">New game</button>
            <button id="btn-undo">Undo</button>
            <button id="btn-flip">Flip</button>
            <button id="btn-draw">Draw</button>
            <button id="btn-resign" class="danger">Resign</button>
        </div>

        <div class="moves">
            <div class="moves-head">
                <span>Moves</span>
                <span id="move-count" class="muted"></span>
            </div>
            <ol class="move-list" id="move-list"></ol>
        </div>
    </aside>

</main>

<!-- new game setup -->
<div class="overlay hidden" id="setup">
    <div class="dialog wide">
        <h2>New game</h2>

        <div class="field">
            <label>Opponent</label>
            <div class="segmented" id="opt-opponent">
                <button data-value="BOT" class="on">Computer</button>
                <button data-value="HUMAN">Two players</button>
            </div>
        </div>

        <div class="field" id="field-difficulty">
            <label>Difficulty</label>
            <div class="segmented" id="opt-difficulty">
                <button data-value="EASY">Easy</button>
                <button data-value="MEDIUM" class="on">Medium</button>
                <button data-value="HARD">Hard</button>
            </div>
            <p class="hint-text" id="difficulty-note"></p>
        </div>

        <div class="field" id="field-side">
            <label>You play</label>
            <div class="segmented" id="opt-side">
                <button data-value="WHITE" class="on">White</button>
                <button data-value="BLACK">Black</button>
            </div>
        </div>

        <div class="dialog-actions">
            <button class="primary" id="setup-start">Start</button>
            <button class="link" id="setup-cancel">Cancel</button>
        </div>
    </div>
</div>

<!-- promotion picker -->
<div class="overlay hidden" id="promotion">
    <div class="dialog">
        <h2>Promote to</h2>
        <div class="promo-choices" id="promo-choices"></div>
        <button class="link" id="promo-cancel">Cancel</button>
    </div>
</div>

<!-- game over / new game -->
<div class="overlay hidden" id="result">
    <div class="dialog">
        <h2 id="result-title">Game over</h2>
        <p id="result-note" class="muted"></p>
        <div class="dialog-actions">
            <button class="primary" id="result-new">New game</button>
            <button class="link" id="result-rematch">Rematch, same settings</button>
            <button class="link" id="result-close">Review board</button>
        </div>
    </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
